server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（带 hash 的构建产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /hanzi-data/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 路由回退：所有路径交给 index.html
    # HTML 禁止缓存，确保发布新版本后浏览器立即拿到最新入口
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
